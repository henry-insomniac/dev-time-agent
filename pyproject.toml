[project]
name = "dev-time-agent"
version = "0.0.0"
description = "Dev Time Agent Runtime"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "langgraph>=1.2.4",
  "pydantic",
  "uvicorn",
]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_time_agent"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
